<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Retail Intelligence</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='4') }}">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-dark app-navbar">
    <div class="container-fluid">
      <a class="navbar-brand fw-semibold" href="/">Smart Retail Intelligence</a>
      <button class="navbar-toggler d-md-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><span class="navbar-toggler-icon"></span></button>
    </div>
  </nav>
  <div class="app-shell">
    <aside class="sidebar offcanvas-md offcanvas-start" tabindex="-1" id="sidebar">
      <div class="offcanvas-header d-md-none"><h5>Navigation</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
      <div class="offcanvas-body d-flex flex-column">
        <p class="eyebrow">Analytics workspace</p>
        <a href="/" class="nav-link">Overview</a>
        <a href="/products" class="nav-link">Product analytics</a>
        <a href="/forecasting" class="nav-link">Demand forecasting</a>
        <div class="mt-auto small text-muted">Phase 8 dashboard</div>
      </div>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
